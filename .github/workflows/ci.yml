name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

jobs:
  validate:
    name: Validar projeto e exportar APK (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -sSL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Instalar export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -sSL -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Importar projeto (headless)
        run: godot --headless --path . --import

      - name: Validar execução headless
        run: godot --headless --path . --quit-after 10

      - name: Rodar teste funcional do personagem
        run: godot --headless --path . --script res://tools/tests/player_smoke_test.gd

      - name: Rodar teste do sistema de teias
        run: godot --headless --path . --script res://tools/tests/web_swing_test.gd

      - name: Instalar SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Instalar pacotes do SDK Android
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Preparar keystore e caminhos do Godot
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.local/share/godot/keystores" "$HOME/.config/godot"
          KEYSTORE="$HOME/.local/share/godot/keystores/debug.keystore"
          rm -f "$KEYSTORE"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          SETTINGS="$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          printf 'export/android/debug_keystore = "%s"\n' "$KEYSTORE" >> "$SETTINGS"
          printf 'export/android/debug_keystore_pass = "android"\n' >> "$SETTINGS"
          printf 'export/android/java_sdk_path = "%s"\n' "${JAVA_HOME:-/usr/lib/jvm/temurin-17-jdk-amd64}" >> "$SETTINGS"
          printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" >> "$SETTINGS"

      - name: Exportar APK de debug
        run: godot --headless --path . --export-debug "Android" build/android/SpiderManNewLife.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: SpiderManNewLife-debug-apk
          path: build/android/SpiderManNewLife.apk
          if-no-files-found: error
